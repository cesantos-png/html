<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Página de Teste</title>
<style>
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --accent: #38bdf8;
    --text: #e2e8f0;
    --muted: #94a3b8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, var(--bg), #1e293b);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--text);
    padding: 24px;
  }
  .card {
    background: var(--card);
    border-radius: 16px;
    padding: 40px;
    max-width: 480px;
    width: 100%;
    box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    text-align: center;
  }
  h1 {
    font-size: 1.8rem;
    margin-bottom: 12px;
  }
  p {
    color: var(--muted);
    margin-bottom: 24px;
    line-height: 1.5;
  }
  .badge {
    display: inline-block;
    background: rgba(56, 189, 248, 0.15);
    color: var(--accent);
    padding: 6px 14px;
    border-radius: 999px;
    font-size: 0.85rem;
    margin-bottom: 20px;
  }
  button {
    background: var(--accent);
    color: #0f172a;
    border: none;
    padding: 12px 24px;
    border-radius: 8px;
    font-weight: 600;
    cursor: pointer;
    font-size: 1rem;
    transition: transform 0.15s ease, opacity 0.15s ease;
  }
  button:hover { opacity: 0.9; transform: translateY(-2px); }
  #counter {
    margin-top: 20px;
    font-size: 1rem;
    color: var(--muted);
  }
  footer {
    margin-top: 28px;
    font-size: 0.75rem;
    color: var(--muted);
  }
</style>
</head>
<body>
  <div class="card">
    <div class="badge">✅ Página funcionando</div>
    <h1>Olá! Esta é uma página de teste</h1>
    <p>Se você está vendo isto, o arquivo HTML foi hospedado com sucesso e está acessível como um site independente.</p>
    <button onclick="incrementar()">Clique aqui</button>
    <div id="counter">Cliques: 0</div>
    <footer>Gerado como arquivo de teste — pronto para hospedar em Netlify, GitHub Pages ou Vercel.</footer>
  </div>

  <script>
    let cliques = 0;
    function incrementar() {
      cliques++;
      document.getElementById('counter').textContent = `Cliques: ${cliques}`;
    }
  </script>
</body>
</html>
